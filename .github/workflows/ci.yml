name: React build and dependency security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies for high-severity known issues
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run check
      - name: Test assessment and account input paths
        run: npm run test
      - name: Production build
        run: npm run build
