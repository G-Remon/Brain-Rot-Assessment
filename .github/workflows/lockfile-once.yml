name: One-time dependency lockfile generator
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create reproducible dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit lockfile for source-control commit
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('package-lock.json','utf8'); console.log('MINDRESET_LOCK_BEGIN'); for(let i=0;i<s.length;i+=900)console.log(JSON.stringify(s.slice(i,i+900))); console.log('MINDRESET_LOCK_END')"
