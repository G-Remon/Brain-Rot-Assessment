<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تأكيد حساب MindReset</title></head>
<body style="margin:0;padding:32px 16px;background:#f5faf9;font-family:Tahoma,Arial,sans-serif;color:#19374a">
<div style="max-width:480px;margin:auto;padding:30px 20px;background:white;border-radius:18px;border:1px solid #ddece6;text-align:center">
<p style="font-size:24px;font-weight:800;color:#16866e;margin:0 0 24px">MindReset</p>
<h1 style="font-size:23px;margin:0 0 14px">أكد بريدك الإلكتروني</h1>
<p style="font-size:15px;line-height:1.9">ادخل كود التأكيد ده في صفحة التسجيل عشان تفعّل حسابك:</p>
<p dir="ltr" style="display:inline-block;font-family:Arial,sans-serif;font-size:32px;letter-spacing:8px;font-weight:800;color:#145b4a;background:#eaf7f1;border-radius:12px;padding:18px 20px;margin:12px 0">{{ .Token }}</p>
<p style="font-size:13px;line-height:1.9;color:#6f8490">الكود مؤقت وصالح لمدة محدودة. لو مش إنت اللي طلبت إنشاء حساب، تجاهل الرسالة.</p>
<p style="font-size:12px;color:#879baa;border-top:1px solid #e6f0ed;padding-top:16px">متحاولش تبعت الكود لأي شخص. فريق MindReset مش هيطلبه منك أبدًا.</p>
</div>
</body></html>
